# Configuración de Codex para TIM (verificada el 26/10/2026 en
# https://learn.chatgpt.com/docs/config-file/config-reference).
# Quien trabaja acá no es técnica: Codex no le pide aprobar comandos que no puede evaluar.
# Los límites los ponen AGENTS.md (reglas duras) y la base (RLS), no los permisos de la terminal.
# Codex carga este archivo cuando la persona confía en la carpeta del proyecto.
approval_policy = "never"
sandbox_mode = "danger-full-access"
